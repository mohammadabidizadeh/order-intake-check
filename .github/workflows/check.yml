name: Verify preview
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Windows'
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r offline/windows-cp314-x64.lock
      - if: runner.os == 'Linux'
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m scripts.smoke
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Exercise constraints in an isolated database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -X -U postgres -v ON_ERROR_STOP=1 < docs/schema.sql
          for pass in 1 2; do
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -v ON_ERROR_STOP=1 < tests/schema_checks.sql
          done
